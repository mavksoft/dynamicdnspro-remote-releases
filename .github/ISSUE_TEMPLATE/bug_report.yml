name: Bug report
description: Report a problem with DDNSPro Remote
labels: ["bug"]
body:
  - type: input
    attributes:
      label: App version
      description: Version shown in About / release tag you installed
      placeholder: e.g. 1.1.0
    validations:
      required: true
  - type: input
    attributes:
      label: Operating system
      placeholder: e.g. macOS 15.1 (viewer) / Windows 11 23H2 (host)
    validations:
      required: true
  - type: input
    attributes:
      label: Remote host agent version
      description: Windows agent version on the remote machine, if known
      placeholder: e.g. 4.7.0
    validations:
      required: false
  - type: textarea
    attributes:
      label: What happened
      description: Steps to reproduce and what you expected
    validations:
      required: true
  - type: textarea
    attributes:
      label: Logs / screenshots
      description: Attach anything that helps reproduce the issue
